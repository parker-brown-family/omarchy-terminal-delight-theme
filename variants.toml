surface       = "#1E0A24"

# TD's "badger" set — strict equal-RGB greyscale, so no blue creeps in.
# Semantic red/yellow/orange/magenta still arrive from the base theme.
[badger]
glyph         = "🦡"
accent        = "#C8C8C8"
accent_bright = "#F2F2F2"
foreground    = "#BDBDBD"
background    = "#070707"
surface       = "#1A1A1A"
