# Terminal Delight — the variant set.
#
# One glyph, one hue, one terminal you can pick out of a wall of terminals.
# Each entry below becomes a full Omarchy theme in ~/.config/omarchy/themes/
# named `terminal-delight-<key>`, so Omarchy's own theme grid
# (Super + Shift + Ctrl + Space) is the picker. No new UI, one click.
#
# Six keys per variant is the whole surface. Everything else — the ANSI
# palette, the darker/lighter background steps, the foreground ramp, the
# window border gradient — is derived from these by bin/build-variants.
# Add a variant by copying a block and changing the colours; re-run
# ./install-variants.sh.
#
#   glyph          the tile face. Any emoji your system renders.
#   accent         the core hue: borders, prompt, bar, highlights
#   accent_bright  the gradient partner the active border runs to
#   foreground     body text — a phosphor in the variant's hue
#   background     the void. Near-black, tinted toward the hue
#   surface        raised panels and selections

[wood]
glyph         = "🪵"
accent        = "#C98F4A"
accent_bright = "#E8C07A"
foreground    = "#C3B49A"
background    = "#0A0705"
surface       = "#1A1310"

