name: ci
on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # Full history: bin/check-shots compares the commit that last
        # touched an image against the one that last touched the code it
        # is a picture of, and a shallow clone has neither.
        with:
          fetch-depth: 0

      - name: deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq gawk shellcheck glslang-tools imagemagick fonts-noto-color-emoji

      - name: screenshots are of the current code
        run: ./bin/check-shots

      - name: test suite
        run: ./test/run

      - name: shellcheck
        run: shellcheck -S warning bin/td-tint bin/td-monitor bin/td-tubes bin/shoot-theme bin/check-shots bin/doctor install-variants.sh install-curve.sh hooks/theme-set.d/td-tint-sync.hook test/run test/install-e2e test/probe-cube-demand test/verify-cube-live test/probe-trail test/probe-aim test/stubs/hyprctl test/stubs/omarchy-theme-color

      - name: td-mcp compiles
        run: python3 -m py_compile bin/td-mcp

      # Every generated frag must compile in BOTH preprocessor states — the
      # still default and the animated opt-in — because td-monitor can flip
      # ANIMATED on any of them at runtime.
      - name: frags compile in both states
        run: |
          ./bin/build-variants --as-themes --into /tmp/themes --reuse-previews
          for f in crt-glass.frag /tmp/themes/*/crt-glass.frag; do
            glslangValidator "$f"
            sed 's/^#define ANIMATED 0/#define ANIMATED 1/' "$f" > /tmp/animated-probe.frag
            glslangValidator /tmp/animated-probe.frag
          done
